name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Build the image
        run: ./docker/build.sh

      # Only unpacks the env's tarballs; a fallback build times out
      - name: Set up the PJRT entry and the MLIR toolchain
        timeout-minutes: 15
        run: ./scripts/setup.sh

      - name: Build the library
        run: ./scripts/build.sh fsim

      - name: Build the NKI driver
        run: ./scripts/build.sh nki

      - name: Generate the nki suite
        run: ./scripts/bench.sh gen --isa nki

      # Every trace validates clean, but each xfail one is rejected
      - name: Validate every recorded trace
        run: |
          # shellcheck disable=SC2016 # expands in the container
          ./docker/exec.sh '
            fsim=drivers/nki/build/custom-cpu-overlap/fsim-nki
            bad=0
            for c in $(python3 benchmarks/nki/suite.py); do
              if out=$($fsim --validate benchmarks/nki/$c/kernel.trace 2>&1); then got=clean; else got=rejected; fi
              case $c in xfail/*) want=rejected ;; *) want=clean ;; esac
              [ $got = $want ] && mark=ok || { mark=FAIL; bad=1; }
              echo "$mark $c: $got: $(tail -n1 <<<"$out")"
            done
            exit $bad'

      # Fails only when a case under an EXPECT prefix lacks its status
      - name: Run the nki suite
        env:
          EXPECT: |
            nkilib/rmsnorm_tkg/ match
            nkilib/layernorm_tkg/ match
            nkilib/qkv_tkg/ match
            xfail/ xfail
        run: |
          out=$(./scripts/bench.sh run --isa nki 2>&1) || true
          echo "$out"
          { echo '```'; echo "$out"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          bad=0
          while read -r prefix want; do
            [ -n "$prefix" ] || continue
            hits=$(grep "^$prefix" <<<"$out" || true)
            [ -n "$hits" ] || { echo "no case under $prefix"; bad=1; continue; }
            while read -r name got _; do
              [ "$got" = "$want" ] || { echo "$name: $got, expected $want"; bad=1; }
            done <<<"$hits"
          done <<<"$EXPECT"
          exit $bad
